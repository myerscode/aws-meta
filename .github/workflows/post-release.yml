name: Post Release Actions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # A PAT is needed so the PR triggers CI and the auto-merge workflow
          # (events created with GITHUB_TOKEN do not trigger other workflows).
          token: ${{ secrets.NIGHTLY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set release variables
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> $GITHUB_OUTPUT

      - name: Get release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            gh release view "$TAG" --json body -q .body
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update README with latest version
        run: |
          latest_tag="${{ steps.release.outputs.tag_name }}"
          
          if [ -f README.md ]; then
            sed -i "s|go get github.com/myerscode/aws-meta@v[0-9]*\.[0-9]*\.[0-9]*|go get github.com/myerscode/aws-meta@$latest_tag|g" README.md
            sed -i "s|go get github.com/myerscode/aws-meta$|go get github.com/myerscode/aws-meta@$latest_tag|g" README.md
          fi

      - name: Update documentation
        run: |
          latest_tag="${{ steps.release.outputs.tag_name }}"
          
          if [ -d docs/ ]; then
            find docs/ -name "*.md" -type f -exec sed -i "s|go get github.com/myerscode/aws-meta@v[0-9]*\.[0-9]*\.[0-9]*|go get github.com/myerscode/aws-meta@$latest_tag|g" {} \;
            find docs/ -name "*.md" -type f -exec sed -i "s|go get github.com/myerscode/aws-meta$|go get github.com/myerscode/aws-meta@$latest_tag|g" {} \;
          fi

      # Replaces the shared update-changelog workflow, which pushes straight to
      # main and is rejected by branch protection.
      - name: Update CHANGELOG
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ steps.release.outputs.tag_name }}
          release-notes: ${{ steps.notes.outputs.body }}

      - name: Commit updates and open pull request
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet; then
            echo "No documentation updates needed"
          else
            branch="chore/post-release-docs-$TAG"
            git checkout -b "$branch"
            git add README.md docs/ CHANGELOG.md 2>/dev/null || true
            git commit -m "docs: update documentation for $TAG"
            # Force: bot-owned branch, so a rerun replaces it
            git push --force origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "docs: update documentation for $TAG" \
              --body "Automated post-release docs and changelog update. Auto-merges once required checks pass."
          fi

  verify-go-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set release variables
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> $GITHUB_OUTPUT

      - name: Wait for Go proxy indexing
        run: sleep 60

      - name: Verify Go package availability
        run: |
          tag_name="${{ steps.release.outputs.tag_name }}"
          module="github.com/myerscode/aws-meta"
          
          echo "🎉 New Go package release: $module@$tag_name"
          echo ""
          echo "📦 Installation:"
          echo "go get $module@$tag_name"
          echo ""
          echo "🔗 Links:"
          echo "- Release: ${{ steps.release.outputs.release_url }}"
          echo "- Go Proxy: https://proxy.golang.org/$module/@v/$tag_name.info"
          echo "- pkg.go.dev: https://pkg.go.dev/$module@$tag_name"
          echo ""
          echo "📚 Documentation:"
          echo "- API Reference: https://github.com/myerscode/aws-meta/blob/main/docs/methods.md"
          echo "- Partitions Package: https://github.com/myerscode/aws-meta/blob/main/docs/partitions.md"
          echo "- Services Package: https://github.com/myerscode/aws-meta/blob/main/docs/services.md"
          
          # Try to verify the module is available
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts: Checking module availability..."
            
            if go list -m "$module@$tag_name" >/dev/null 2>&1; then
              echo "✅ Go module successfully published and available!"
              break
            else
              echo "⏳ Module not yet available, waiting..."
              sleep 30
              attempt=$((attempt + 1))
            fi
          done