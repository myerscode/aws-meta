name: Nightly Data Update auto-merge

# Nightly-data-update copy of the Dependabot auto-merge flow (myerscode/workflows
# dependabot-auto-merge.yml): approves and arms auto-merge on the nightly data
# update PR. GitHub completes --auto only once required checks pass and the
# branch has no conflicts. Requires "Allow auto-merge" and "Allow GitHub Actions
# to create and approve pull requests" in repo settings.

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-update-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act on the nightly update branch pushed from this repo, never forks.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'chore/nightly-data-update-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Approve the pull request
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
