name: Nightly Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          
      - name: Run generate command
        run: go run . generate
        env:
          AWSMETA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: git-diff
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Only add files that should be updated by the generate command
          git add pkg/data/manifests/ go.mod go.sum
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected, skipping release"
          else
            current_date=$(date +'%Y-%m-%d')
            git commit -m "nightly: update AWS data $current_date"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected, proceeding with release"
          fi

      - name: Push changes if any
        if: steps.git-diff.outputs.changed == 'true'
        run: git push origin main

      - name: Get latest tag and calculate next version
        if: steps.git-diff.outputs.changed == 'true'
        id: get-version
        run: |
          latest=$(git tag --sort=-version:refname | head -n 1)
          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            # Extract version numbers
            version=${latest#v}
            IFS='.' read -r major minor patch <<< "$version"
            # Increment minor version for nightly releases
            next="v$major.$((minor+1)).0"
          fi
          echo "next_tag=$next" >> $GITHUB_OUTPUT
          echo "Previous tag: $latest"
          echo "Next tag: $next"

      - name: Create and push tag
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git tag ${{ steps.get-version.outputs.next_tag }}
          git push origin ${{ steps.get-version.outputs.next_tag }}

      - name: Checkout the tagged commit
        if: steps.git-diff.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-version.outputs.next_tag }}
          fetch-depth: 0

      - name: Run GoReleaser
        if: steps.git-diff.outputs.changed == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
