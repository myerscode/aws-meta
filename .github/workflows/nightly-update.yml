name: Nightly Data Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A PAT/App token is needed so the PR triggers CI and the auto-merge workflow
          # (events created with GITHUB_TOKEN do not trigger other workflows).
          token: ${{ secrets.NIGHTLY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run generate command
        run: go run . generate --output ..
        working-directory: cli
        env:
          AWSMETA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes and commit
        id: git-diff
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          current_date=$(date +'%Y-%m-%d')
          git checkout -b "chore/nightly-data-update-$current_date"
          echo "branch=chore/nightly-data-update-$current_date" >> $GITHUB_OUTPUT
          
          # Only add files that should be updated by the generate command
          git add pkg/data/manifests/ pkg/data/archive/
          
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📊 No changes detected in AWS data"
          else
            cat > commit_message.txt << EOF
          chore(data): ⏳nightly AWS data update ($current_date)
          
          - Updated partition data
          - Updated region data
          - Updated service data
          
          Generated on: $current_date
          EOF
            git commit -F commit_message.txt
            rm commit_message.txt
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📊 Changes detected in AWS data, committing updates"
          fi

      - name: Push branch and open pull request
        if: steps.git-diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.git-diff.outputs.branch }}
        run: |
          # Force: the branch is a dated bot-owned branch, so a same-day rerun replaces it
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(data): ⏳nightly AWS data update ($(date +'%Y-%m-%d'))" \
            --body "Automated nightly AWS data update. Auto-merges once required checks pass."
          echo "✅ AWS data updates pushed to $BRANCH and pull request opened"

      - name: Log completion
        run: |
          if [ "${{ steps.git-diff.outputs.changed }}" == "true" ]; then
            echo "🎉 Nightly data update completed successfully"
            echo "📈 Latest AWS service, region, and partition data is now available"
            echo "🔄 Weekly release workflow will create the next version tag"
          else
            echo "✨ No updates needed - AWS data is current"
          fi
